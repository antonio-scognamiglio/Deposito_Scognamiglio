server:
  port: 8082

spring:

  application:
    name: orders

  ai:
    vectorstore:
      pgvector:
        dimensions: 768
        initialize-schema: true
        schema-name: orders

    model:
      embedding: ollama

    openai:
      # Base URL dell'endpoint OpenAI-compatibile di Groq.
      # Spring AI aggiunge da solo il completions path (/v1/chat/completions), quindi NON includere /v1 qui.
      base-url: https://api.groq.com/openai

      # Chiave API recuperata dalle variabili d'ambiente per motivi di sicurezza.
      api-key: ${API_KEY}

      chat:
        options:
          # Modello Groq da utilizzare.
          model: openai/gpt-oss-120b

    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: nomic-embed-text

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: orders

product-service.url: http://localhost:8081/store
